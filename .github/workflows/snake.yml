# ════════════════════════════════════════════════════════════════════
# 贡献贪吃蛇：机器人每天自动画一次「小蛇吃掉今年的贡献格子」
#   产出 SVG 推到 output 分支 → README 用 raw 链接引用
#   公开仓库跑 Actions 免费，不花钱
# 创建：2026-10-06（小鲸）
# ════════════════════════════════════════════════════════════════════
name: 生成贡献贪吃蛇

on:
  schedule:
    - cron: "0 0 * * *"      # 每天 UTC 0 点（北京时间早 8 点）跑一次
  workflow_dispatch:          # 也能在 Actions 页面手动点一下就跑
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 Platane/snk 生成贪吃蛇
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF6EC7&color_dots=#2D1B4E,#9F7AEA,#4FD1C5,#68D391,#FFD93D
            dist/snake-dark.svg?palette=github-dark

      - name: 推到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
