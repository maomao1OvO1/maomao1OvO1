# ════════════════════════════════════════════════════════════════════
# 3D 贡献图：把贡献格子堆成 3D 山，生成 SVG 提交回本仓库
#   产出在 assets/profile-3d-contrib/ 下 → README 直接引用
# 创建：2026-10-06（小鲸）
# ════════════════════════════════════════════════════════════════════
name: 生成 3D 贡献图

on:
  schedule:
    - cron: "30 0 * * *"     # 每天 UTC 0:30 跑一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 3D 贡献图
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "更新 3D 贡献图" || exit 0
          git push
