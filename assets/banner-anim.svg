<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" height="170" role="img" aria-label="毛毛 · 动态装饰横幅">
  <!-- ════════════════════════════════════════════════════════════════
       文件：assets/banner-anim.svg —— 主页顶部动态装饰横幅
       说明：这是**自己写**的 SVG 动画（GitHub 支持 SVG 里的 <animate>），
             不依赖任何外部图床服务 ⇒ 不会因为第三方挂掉而破图。
       内容：① 深紫渐变底；② 三条流动光带（粉 / 青 / 绿，速度各不同）；
             ③ 一排错开闪烁的星点；④ 两端呼吸光晕；⑤ 上下霓虹细线。
       注意：SVG 里**不放中文文字** —— GitHub 渲染 SVG 时字体不可控，
             中文字容易变方块，所以文字交给 Markdown 层写。
       创建：2026-10-06（小鲸）
       ════════════════════════════════════════════════════════════════ -->
  <defs>
    <!-- 底色：左深紫 → 右紫罗兰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#241043"/>
      <stop offset="55%"  stop-color="#3B0F6B"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- 三条「流动光带」：中间亮、两头透明，靠 gradientTransform 平移制造流动感 -->
    <linearGradient id="flowPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF6EC7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6EC7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="4.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4FD1C5" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4FD1C5" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="1 0; -1 0; 1 0" dur="5.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#68D391" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#68D391" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#68D391" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="6.8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 上下霓虹细线 -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#FF6EC7" stop-opacity=".8"/>
      <stop offset="50%"  stop-color="#FFD93D" stop-opacity=".9"/>
      <stop offset="75%"  stop-color="#4FD1C5" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#68D391" stop-opacity="0"/>
    </linearGradient>

    <!-- 两端呼吸光晕 -->
    <radialGradient id="glowL" cx="0" cy=".5" r=".6">
      <stop offset="0%"   stop-color="#FF6EC7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF6EC7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="1" cy=".5" r=".6">
      <stop offset="0%"   stop-color="#68D391" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#68D391" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ① 底 -->
  <rect width="1200" height="170" fill="url(#bg)"/>

  <!-- ② 两端呼吸光晕 -->
  <rect width="520" height="170" fill="url(#glowL)">
    <animate attributeName="opacity" values=".55; 1; .55" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="680" width="520" height="170" fill="url(#glowR)">
    <animate attributeName="opacity" values="1; .5; 1" dur="6.4s" repeatCount="indefinite"/>
  </rect>

  <!-- ③ 三条流动光带 -->
  <rect x="0" y="46"  width="1200" height="5" rx="2.5" fill="url(#flowPink)"/>
  <rect x="0" y="82"  width="1200" height="4" rx="2"   fill="url(#flowCyan)"/>
  <rect x="0" y="118" width="1200" height="5" rx="2.5" fill="url(#flowGreen)"/>

  <!-- ④ 星点：错开时间闪烁 -->
  <g fill="#FFE9FF">
    <circle cx="90"   cy="34"  r="2.4"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="215"  cy="132" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="2.7s" begin=".3s"  repeatCount="indefinite"/></circle>
    <circle cx="330"  cy="24"  r="2.1"><animate attributeName="opacity" values=".15;1;.15" dur="1.9s" begin=".6s"  repeatCount="indefinite"/></circle>
    <circle cx="455"  cy="146" r="2.6"><animate attributeName="opacity" values=".15;1;.15" dur="3.1s" begin=".9s"  repeatCount="indefinite"/></circle>
    <circle cx="580"  cy="30"  r="1.7"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="705"  cy="140" r="2.3"><animate attributeName="opacity" values=".15;1;.15" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="830"  cy="26"  r="2.0"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="950"  cy="144" r="2.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.3s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1075" cy="32"  r="1.9"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ⑤ 上下霓虹细线（带轻微呼吸） -->
  <rect x="0" y="0"   width="1200" height="3" fill="url(#edge)">
    <animate attributeName="opacity" values=".5; 1; .5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="167" width="1200" height="3" fill="url(#edge)">
    <animate attributeName="opacity" values="1; .5; 1" dur="4.6s" repeatCount="indefinite"/>
  </rect>
</svg>
